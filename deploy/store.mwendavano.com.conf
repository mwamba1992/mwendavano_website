# store.mwendavano.com is retired: the old Global Authentic Nuxt shop. Every page sends visitors (and Google)
# to the Global Authentics section of the company site with a permanent redirect.
#   cp /etc/nginx/sites-available/store.mwendavano.com /root/store.mwendavano.com.conf.bak
#   cp /var/www/mwendavano-website/deploy/store.mwendavano.com.conf /etc/nginx/sites-available/store.mwendavano.com
#   nginx -t && systemctl reload nginx
# Keep the certificate (it renews itself) so https:// links still redirect instead of showing a warning.

server {
    listen 443 ssl;
    server_name store.mwendavano.com;

    ssl_certificate /etc/letsencrypt/live/store.mwendavano.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/store.mwendavano.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / { return 301 https://mwendavano.com/#retail; }
}

server {
    listen 80;
    listen [::]:80;
    server_name store.mwendavano.com;

    location / { return 301 https://mwendavano.com/#retail; }
}
