# nginx site for mwendavano.com (same layout as the dukanimauzo.com site). Install or update:
#   cp /var/www/mwendavano-website/deploy/mwendavano.com.conf /etc/nginx/sites-available/mwendavano.com
#   nginx -t && systemctl reload nginx
# Certificate: certbot certonly --nginx -d mwendavano.com -d www.mwendavano.com (renews itself).

server {
    listen 443 ssl;
    server_name mwendavano.com;

    root /var/www/mwendavano-website;   # git clone of github.com/mwamba1992/mwendavano_website
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mwendavano.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mwendavano.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/xml application/manifest+json;
    gzip_min_length 1024;

    # Never serve the repo or deploy notes.
    location ~ /\.(?!well-known) { deny all; }
    location /deploy/ { return 404; }
    location = /README.md { return 404; }

    # Dukani pages that were reachable here by mistake (the dukanimauzo.com block used to answer for this name):
    # send any old links or bookmarks to Dukani's own address.
    location ~ ^/(welcome|privacy|terms|login|handoff)(/|$) { return 301 https://dukanimauzo.com$request_uri; }

    # The page changes with each release; images and icons can be cached for a week.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /img/ { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }

    location / {
        try_files $uri $uri/ =404;
    }
}

# www -> main address
server {
    listen 443 ssl;
    server_name www.mwendavano.com;

    ssl_certificate /etc/letsencrypt/live/mwendavano.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mwendavano.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://mwendavano.com$request_uri;
}

# http -> https on the main address
server {
    listen 80;
    listen [::]:80;
    server_name mwendavano.com www.mwendavano.com;

    return 301 https://mwendavano.com$request_uri;
}
