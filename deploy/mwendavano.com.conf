# Host nginx site for the production VPS (same server as the Dukani and Wafanyakazi apps). Install:
#   sudo cp deploy/mwendavano.com.conf /etc/nginx/sites-available/mwendavano.com
#   sudo ln -s /etc/nginx/sites-available/mwendavano.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mwendavano.com -d www.mwendavano.com --redirect   # adds the 443 server + redirect
server {
    listen 80;
    listen [::]:80;
    server_name mwendavano.com www.mwendavano.com;

    root /var/www/mwendavano-website;   # this folder (index.html, img/, favicon.svg, og.jpg, robots.txt, sitemap.xml)
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/xml;
    gzip_min_length 1024;

    # Never serve the repo or deploy notes.
    location ~ /\.(?!well-known) { deny all; }
    location /deploy/ { return 404; }
    location = /README.md { return 404; }

    # Dukani pages that were reachable here by mistake (the dukanimauzo.com block used to answer for this name):
    # send any old links or bookmarks to Dukani's own address.
    location ~ ^/(welcome|privacy|terms|login|handoff)(/|$) { return 301 https://dukanimauzo.com$request_uri; }

    # The page changes with each release; images can be cached for a week.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /img/ { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
